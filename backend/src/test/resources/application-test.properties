# Test profile - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable multitenancy for tests
spring.jpa.properties.hibernate.multiTenancy=NONE
rfbooks.multitenancy.enabled=false

# Allow bean definition overriding for test configs
spring.main.allow-bean-definition-overriding=true

# Plaid - disabled for tests
plaid.client-id=test
plaid.secret=test
plaid.env=sandbox
