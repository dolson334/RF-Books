# RF Books Spring Boot backend
server.port=8081

plaid.client-id=693755f5f1a1190023729ef4
plaid.secret=ed0c5480552215d340ef37eb99aa6f
plaid.environment=sandbox

# Database - PostgreSQL with schema-based multitenancy
spring.datasource.url=jdbc:postgresql://localhost:5433/rfbooks
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driverClassName=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=testresort
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Disable default schema creation in favor of multitenancy
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.rfbooks.config.CurrentTenantIdentifierResolverImpl


